apf_node:
  ros__parameters:
    base_link: base_link
    tip_link: tool0

    # Artificial potential field
    k_att: 1.0
    k_rep: 0.02
    k_tan: 0.04
    k_ori: 1.0
    d0: 0.20
    d_min: 0.03
    v_max: 0.08
    omega_max: 0.5

    # Joint-space integration and goal check
    damping: 0.05
    control_rate: 50.0
    trajectory_horizon: 0.1
    position_tolerance: 0.01
    orientation_tolerance: 0.05
