computed_torque_node:
  ros__parameters:
    base_link: base_link
    tip_link: tool0
    control_rate: 500.0
    trajectory_topic: /joint_trajectory_controller/joint_trajectory
    effort_topic: /effort_controller/commands
    kp: [800.0, 800.0, 400.0, 200.0, 200.0, 200.0]
    kd: [40.0, 40.0, 20.0, 10.0, 10.0, 10.0]
    effort_limits: [330.0, 330.0, 150.0, 54.0, 54.0, 54.0]
    # Used when a trajectory point has no velocities and no prior sample exists.
    default_trajectory_horizon: 0.1
